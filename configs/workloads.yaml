# Workload shapes for `llmopt bench`.
# The adapters take token counts, not text, so a workload is a shape:

smoke:
  prompt_tokens: 32
  output_tokens: 16
  num_requests: 8
chat:
  prompt_tokens: 128
  output_tokens: 256
  num_requests: 16
long:
  prompt_tokens: 4096
  output_tokens: 128
  num_requests: 8
