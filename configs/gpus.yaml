# Keyed by gfx target. These are the precisions the hardware can run.
# Phase 1 scope is BF16 and FP8 (FP8 KV cache is a separate setting, kv_cache_dtype).
# MI300X has no native FP4, so mxfp4 is only listed for gfx950 (Phase 2).
# FP8 on gfx942 is expected to be the FNUZ variant. Confirm on the pinned stack.
gfx942:
  name: AMD Instinct MI300X
  hbm_gb: 192
  precisions: [bf16, fp8]

gfx950:
  name: AMD Instinct MI350 series (MI350X, MI355X)
  hbm_gb: 288
  precisions: [bf16, fp8, mxfp4]